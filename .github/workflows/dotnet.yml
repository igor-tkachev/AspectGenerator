name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    env:
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
      SOLUTION: AspectGenerator.slnx

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet: ['10.0.x']
        # Debug also runs the generator trace and call-site prefilter assertions, which are compiled only under DEBUG.
        configuration: [Release, Debug]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet }}
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}
    - name: Check tracked build artifacts
      shell: bash
      run: |
        if git ls-files | grep -E '(^|/)obj/|(^|/)bin/'; then
          echo "Build artifacts must not be tracked."
          exit 1
        fi
    - name: Build
      run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}
    - name: Test
      run: dotnet test ${{ env.SOLUTION }} --no-build --configuration ${{ env.BUILD_CONFIGURATION }} --verbosity normal
    - name: Pack
      if: matrix.configuration == 'Release'
      run: dotnet pack Source/AspectGenerator.csproj --no-build --configuration ${{ env.BUILD_CONFIGURATION }}

  # The documented minimum build toolchain: SDK 10.0.200 is the first one that ships Roslyn 5.3.
  minimum-sdk:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.200'
    - name: Pin SDK
      run: dotnet new globaljson --sdk-version 10.0.200 --roll-forward disable --force
    - name: Restore dependencies
      run: dotnet restore AspectGenerator.slnx
    - name: Build
      run: dotnet build AspectGenerator.slnx --no-restore --configuration Release
    - name: Test
      run: dotnet test AspectGenerator.slnx --no-build --configuration Release --verbosity normal

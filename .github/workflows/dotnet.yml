name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    env:
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
      SOLUTION: AspectGenerator.slnx
      MSBUILDDISABLENODEREUSE: "1"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet: ['10.0.x']
        # Debug also runs the generator trace and call-site prefilter assertions, which are compiled only under DEBUG.
        configuration: [Release, Debug]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet }}
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}
    - name: Check tracked build artifacts
      shell: bash
      run: |
        if git ls-files | grep -E '(^|/)obj/|(^|/)bin/'; then
          echo "Build artifacts must not be tracked."
          exit 1
        fi
    - name: Build
      run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration ${{ env.BUILD_CONFIGURATION }} -warnaserror -nodeReuse:false
    - name: Pack for package-content validation
      run: dotnet pack Source/AspectGenerator.csproj --no-build --configuration ${{ env.BUILD_CONFIGURATION }} -warnaserror -nodeReuse:false
    - name: Test
      run: dotnet test ${{ env.SOLUTION }} --no-build --configuration ${{ env.BUILD_CONFIGURATION }} --verbosity normal

  # The documented minimum build toolchain: SDK 9.0.100 is the first one that ships Roslyn 4.12, the Roslyn the generator is built against.
  # The generator and its tests are built with the current SDK (the solution targets net10.0); SDK 9.0.100 builds consumers of the packed generator,
  # which is what the minimum applies to. The unit tests compile against the same Roslyn 4.12 and run in the build job. The 8.0 runtime runs the net8.0 consumer.
  minimum-sdk:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.100
          10.0.x
    - name: Build and pack the generator
      shell: bash
      run: |
        set -euo pipefail
        version="$(dotnet msbuild Source/AspectGenerator.csproj -getProperty:Version)"
        [ -n "$version" ] || { echo "Cannot read the package version from Source/AspectGenerator.csproj" >&2; exit 1; }
        echo "ASPECT_GENERATOR_VERSION=$version" >> "$GITHUB_ENV"
        dotnet build Source/AspectGenerator.csproj --configuration Release -warnaserror
        dotnet pack Source/AspectGenerator.csproj --no-build --configuration Release --output "$RUNNER_TEMP/feed"
    - name: Build and run consumers
      shell: bash
      run: |
        set -euo pipefail
        for tfm in net8.0 net9.0; do
          dir="$RUNNER_TEMP/consumer-$tfm"
          mkdir -p "$dir"
          (cd "$dir" && dotnet new globaljson --sdk-version 9.0.100 --roll-forward disable --force)
          cat > "$dir/nuget.config" <<EOF
        <configuration>
          <packageSources>
            <clear />
            <add key="feed" value="$RUNNER_TEMP/feed" />
            <add key="nuget" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="feed">
              <package pattern="AspectGenerator" />
            </packageSource>
            <packageSource key="nuget">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF
          cat > "$dir/Consumer.csproj" <<EOF
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>Exe</OutputType>
            <TargetFramework>$tfm</TargetFramework>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="AspectGenerator" Version="$ASPECT_GENERATOR_VERSION" PrivateAssets="all" />
          </ItemGroup>
        </Project>
        EOF
          cat > "$dir/Program.cs" <<'EOF'
        using AspectGenerator;

        [Aspect(OnBeforeCall = nameof(OnBeforeCall))]
        [AttributeUsage(AttributeTargets.Method)]
        sealed class CountAttribute : Attribute
        {
            public static int Calls;
            public static void OnBeforeCall(InterceptInfo info) { Calls++; }
        }

        // Applied to a type with a TargetFilter, so that the filter parser runs inside the packed generator on the oldest toolchain.
        [Aspect(OnBeforeCall = nameof(OnBeforeCall))]
        [AttributeUsage(AttributeTargets.Class)]
        sealed class FilteredAttribute : Attribute
        {
            public static int Calls;
            public string? TargetFilter { get; set; }
            public static void OnBeforeCall(InterceptInfo info) { Calls++; }
        }

        static class Service
        {
            [Count] public static int Twice(int x) { return x * 2; }
        }

        [Filtered(TargetFilter = "contains: Selected")]
        static class FilteredService
        {
            public static int Selected(int x) { return x + 1; }
            public static int Other(int x) { return x + 2; }
        }

        static class Program
        {
            static int Main()
            {
                var result = Service.Twice(21);
                var filtered = FilteredService.Selected(1) + FilteredService.Other(1);
                Console.WriteLine($"result={result} calls={CountAttribute.Calls} filtered={filtered} filteredCalls={FilteredAttribute.Calls}");
                // Only the call the filter selects is intercepted.
                return result == 42 && CountAttribute.Calls == 1 && filtered == 5 && FilteredAttribute.Calls == 1 ? 0 : 1;
            }
        }
        EOF
          (cd "$dir" && dotnet --version && dotnet restore --packages "$dir/packages")
          # An isolated cache and source mapping require the local package; verify its exact bytes as well.
          cmp "$RUNNER_TEMP/feed/AspectGenerator.$ASPECT_GENERATOR_VERSION.nupkg" "$dir/packages/aspectgenerator/${ASPECT_GENERATOR_VERSION,,}/aspectgenerator.${ASPECT_GENERATOR_VERSION,,}.nupkg"
          (cd "$dir" && dotnet build --configuration Release --no-restore && dotnet run --configuration Release --no-build)
        done

  # The target filter parser is generated ahead of the build (Source/TargetFilter/regenerate.sh, at the DotGram commit and
  # SDK in Source/TargetFilter/dotgram.pin) and committed. This job regenerates it exactly as a developer does and fails
  # when the committed folder differs: a grammar edited without regenerating, a stale or hand-edited file, a leftover file.
  # Windows checks as well that the checkout's line-ending conversion leaves the generated folder byte for byte as written.
  filter-parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Read the pin
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        sdk="$(sed -n 's/^sdk=//p' Source/TargetFilter/dotgram.pin | tr -d '\r')"
        [ -n "$sdk" ] || { echo "Source/TargetFilter/dotgram.pin has no sdk=" >&2; exit 1; }
        echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ steps.pin.outputs.sdk }}
    - name: Select the pinned SDK
      shell: bash
      # The runner image may have a newer SDK installed; the script refuses anything but the pinned one.
      run: dotnet new globaljson --sdk-version "${{ steps.pin.outputs.sdk }}" --roll-forward disable --force
    - name: Regenerate the parser
      shell: bash
      run: Source/TargetFilter/regenerate.sh
    - name: The committed parser is current
      shell: bash
      run: |
        status="$(git status --porcelain --untracked-files=all -- Source/TargetFilter)"
        if [ -n "$status" ]; then
          echo "Source/TargetFilter differs after regeneration; run Source/TargetFilter/regenerate.sh and commit the result:" >&2
          echo "$status" >&2
          git --no-pager diff --stat -- Source/TargetFilter >&2
          exit 1
        fi
